[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coagula"
version = "0.3.8"
description = "Local context manicuring funnel: trim, dedup, prune, rank, and compress LLM context before it reaches a frontier model."
requires-python = ">=3.10"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "pat-nel87" }]
dependencies = []

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.7"]
ollama = []   # documentation only — coagula.models.ollama uses stdlib urllib
mcp = ["mcp>=1.0,<2.0"]
all = ["mcp>=1.0,<2.0", "tiktoken>=0.7"]
dev = ["pytest>=8", "mcp>=1.0,<2.0"]

[project.scripts]
coagula = "coagula.cli:main"
coagula-mcp = "coagula.mcp.server:main"

[tool.setuptools.packages.find]
include = ["coagula*"]
exclude = ["tests*"]
