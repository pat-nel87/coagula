name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -v
      - name: Smoke-test demo (Linux/macOS)
        if: runner.os != 'Windows'
        run: python demo.py | tail -5
      - name: Smoke-test demo (Windows)
        if: runner.os == 'Windows'
        run: python demo.py | Select-Object -Last 5
        shell: pwsh

  # Syntax-validate the PowerShell hooks + installers. Cheap and
  # native-Windows so we catch PS parsing regressions in PRs.
  powershell-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse all .ps1 files
        shell: pwsh
        run: |
          $ps1 = Get-ChildItem -Recurse -Filter *.ps1 integrations
          $fail = 0
          foreach ($f in $ps1) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              Write-Host "FAIL: $($f.FullName)"
              $errors | ForEach-Object { Write-Host "  $($_.Message) (line $($_.Extent.StartLineNumber))" }
              $fail = 1
            } else {
              Write-Host "OK:   $($f.FullName)"
            }
          }
          if ($fail) { exit 1 }

  # Lint the bash hooks. shellcheck catches the standard footguns; cheap
  # on a Linux runner.
  shell-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck integrations/**/*.sh

  # Verify the Windows installer scripts actually run and produce valid
  # config JSON. Sandboxes USERPROFILE to a temp dir so the runner's home
  # is untouched.
  installer-dryrun-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install coagula (needed so install scripts find `coagula`)
        run: pip install -e .
      - name: Sandbox USERPROFILE and run Copilot CLI installer
        shell: pwsh
        run: |
          $sandbox = Join-Path $env:RUNNER_TEMP "coagula-sandbox"
          New-Item -ItemType Directory -Force -Path $sandbox | Out-Null
          $env:USERPROFILE = $sandbox
          .\integrations\copilot-cli\install.ps1
          $cfg = Join-Path $sandbox '.copilot\hooks\coagula.json'
          if (-not (Test-Path $cfg)) { Write-Host "FAIL: $cfg not created"; exit 1 }
          $parsed = Get-Content -Raw -LiteralPath $cfg | ConvertFrom-Json
          if (-not $parsed.hooks.preToolUse[0].bash)       { Write-Host "FAIL: preToolUse.bash missing"; exit 1 }
          if (-not $parsed.hooks.preToolUse[0].powershell) { Write-Host "FAIL: preToolUse.powershell missing"; exit 1 }
          if (-not $parsed.hooks.postToolUse[0].bash)       { Write-Host "FAIL: postToolUse.bash missing"; exit 1 }
          if (-not $parsed.hooks.postToolUse[0].powershell) { Write-Host "FAIL: postToolUse.powershell missing"; exit 1 }
          Write-Host "PASS: dual-field config created at $cfg"
  # Feed synthetic Copilot CLI payloads to each PowerShell hook on a
  # Windows runner. Catches PS-specific bugs (string-quoting, encoding,
  # JSON serialization) that the parse check misses.
  ps-hook-stdin-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install coagula
        run: pip install -e .
      - name: preToolUse — kubectl should be rewritten
        shell: pwsh
        run: |
          $payload = '{"sessionId":"x","timestamp":1,"cwd":"/tmp","toolName":"bash","toolArgs":"{\"command\":\"kubectl get pod -o json\",\"description\":\"x\",\"initial_wait\":30}"}'
          $env:COAGULA_QUERY = "why is pod crashing"
          # Force native PS path by hiding the .sh sibling temporarily.
          Move-Item integrations/copilot-cli/coagula-pre-bash-hook.sh integrations/copilot-cli/coagula-pre-bash-hook.sh.bak
          try {
            $out = $payload | pwsh -NoProfile -File integrations/copilot-cli/coagula-pre-bash-hook.ps1
          } finally {
            Move-Item integrations/copilot-cli/coagula-pre-bash-hook.sh.bak integrations/copilot-cli/coagula-pre-bash-hook.sh
          }
          $obj = $out | ConvertFrom-Json
          if (-not $obj.modifiedArgs.command) { Write-Host "FAIL: no modifiedArgs.command"; exit 1 }
          if ($obj.modifiedArgs.command -notmatch 'coagula --query.*--profile k8s') {
            Write-Host "FAIL: rewrite missing k8s profile: $($obj.modifiedArgs.command)"; exit 1
          }
          Write-Host "PASS: preToolUse kubectl rewrite ($($obj.modifiedArgs.command))"
      - name: preToolUse — curl should be rewritten (lite mode, no query)
        shell: pwsh
        run: |
          # No COAGULA_QUERY set — the hook should now OMIT --query so the
          # CLI runs in lite mode. Assertion: `coagula --profile passthrough`
          # is present, `--query` is absent.
          $payload = '{"sessionId":"x","timestamp":1,"cwd":"/tmp","toolName":"bash","toolArgs":"{\"command\":\"curl -s https://api.example.com/big.json\"}"}'
          Move-Item integrations/copilot-cli/coagula-pre-bash-hook.sh integrations/copilot-cli/coagula-pre-bash-hook.sh.bak
          try {
            $out = $payload | pwsh -NoProfile -File integrations/copilot-cli/coagula-pre-bash-hook.ps1
          } finally {
            Move-Item integrations/copilot-cli/coagula-pre-bash-hook.sh.bak integrations/copilot-cli/coagula-pre-bash-hook.sh
          }
          $obj = $out | ConvertFrom-Json
          $cmd = $obj.modifiedArgs.command
          if (-not $cmd -or $cmd -notmatch 'coagula --profile') {
            Write-Host "FAIL: curl not rewritten: $($obj | ConvertTo-Json -Compress)"; exit 1
          }
          if ($cmd -match '--query') {
            Write-Host "FAIL: --query appeared in rewrite despite no COAGULA_QUERY: $cmd"; exit 1
          }
          Write-Host "PASS: curl rewritten in lite mode ($cmd)"
      - name: preToolUse — Invoke-WebRequest (PS cmdlet) should be rewritten
        shell: pwsh
        run: |
          # PowerShell cmdlets like Invoke-WebRequest are common when MCP
          # endpoints are reached over HTTPS from a locked-down corp box.
          # Setting COAGULA_QUERY here also verifies the --query path.
          $env:COAGULA_QUERY = "what's wrong with the deployment"
          $payload = '{"sessionId":"x","timestamp":1,"cwd":"/tmp","toolName":"bash","toolArgs":"{\"command\":\"Invoke-WebRequest https://mcp.internal/big -UseBasicParsing\"}"}'
          Move-Item integrations/copilot-cli/coagula-pre-bash-hook.sh integrations/copilot-cli/coagula-pre-bash-hook.sh.bak
          try {
            $out = $payload | pwsh -NoProfile -File integrations/copilot-cli/coagula-pre-bash-hook.ps1
          } finally {
            Move-Item integrations/copilot-cli/coagula-pre-bash-hook.sh.bak integrations/copilot-cli/coagula-pre-bash-hook.sh
          }
          $obj = $out | ConvertFrom-Json
          if (-not $obj.modifiedArgs.command -or $obj.modifiedArgs.command -notmatch 'coagula --query') {
            Write-Host "FAIL: Invoke-WebRequest not rewritten: $($obj | ConvertTo-Json -Compress)"; exit 1
          }
          Write-Host "PASS: Invoke-WebRequest rewritten with --query"
      - name: preToolUse — toolName='powershell' (Windows Copilot CLI) should rewrite
        shell: pwsh
        run: |
          # Regression for v0.3.6: Windows Copilot CLI emits toolName='powershell'
          # for shell calls, not 'bash'. v0.3.5 hardcoded toolName=='bash' so the
          # pre-tool hook never fired on Windows.
          $payload = '{"sessionId":"x","timestamp":1,"cwd":"/tmp","toolName":"powershell","toolArgs":"{\"command\":\"kubectl get pod -o json\"}"}'
          $env:COAGULA_QUERY = "why is pod crashing"
          Move-Item integrations/copilot-cli/coagula-pre-bash-hook.sh integrations/copilot-cli/coagula-pre-bash-hook.sh.bak
          try {
            $out = $payload | pwsh -NoProfile -File integrations/copilot-cli/coagula-pre-bash-hook.ps1
          } finally {
            Move-Item integrations/copilot-cli/coagula-pre-bash-hook.sh.bak integrations/copilot-cli/coagula-pre-bash-hook.sh
          }
          $obj = $out | ConvertFrom-Json
          $cmd = $obj.modifiedArgs.command
          if (-not $cmd -or $cmd -notmatch 'coagula --query.*--profile k8s') {
            Write-Host "FAIL: toolName=powershell not rewritten with k8s profile: $($obj | ConvertTo-Json -Compress)"; exit 1
          }
          Write-Host "PASS: toolName=powershell rewritten with k8s profile"
      - name: preToolUse — semicolon-chained PowerShell parses cleanly
        shell: pwsh
        run: |
          # v0.3.7 regression for Bug A: bash `( cmd1; cmd2 )` is a subshell;
          # PowerShell `( cmd1; cmd2 )` is a grouping expression that errors
          # "Missing closing ')'". The hook must emit `& { … }` (script
          # block) when toolName=powershell so chained commands parse.
          $payload = '{"toolName":"powershell","toolArgs":"{\"command\":\"curl https://a.example; curl https://b.example\"}"}'
          Move-Item integrations/copilot-cli/coagula-pre-bash-hook.sh integrations/copilot-cli/coagula-pre-bash-hook.sh.bak
          try {
            $out = $payload | pwsh -NoProfile -File integrations/copilot-cli/coagula-pre-bash-hook.ps1
          } finally {
            Move-Item integrations/copilot-cli/coagula-pre-bash-hook.sh.bak integrations/copilot-cli/coagula-pre-bash-hook.sh
          }
          $obj = $out | ConvertFrom-Json
          $cmd = $obj.modifiedArgs.command
          if (-not $cmd) { Write-Host "FAIL: no modifiedArgs.command"; exit 1 }
          # Must use the script-block wrapper, not the bash subshell form.
          if ($cmd -notmatch '^& \{') {
            Write-Host "FAIL: PS rewrite missing script-block form: $cmd"; exit 1
          }
          # And it must parse as valid PowerShell (the actual regression).
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseInput(
            $cmd, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors -and $errors.Count -gt 0) {
            Write-Host "FAIL: rewritten command does not parse as PowerShell:"
            $errors | ForEach-Object { Write-Host "  $($_.Message)" }
            Write-Host "Command was: $cmd"
            exit 1
          }
          Write-Host "PASS: ;-chained PS command rewrites + parses ($cmd)"
      - name: postToolUse — PS preserves newlines + reports plausible token count
        shell: pwsh
        run: |
          # v0.3.8 regression for Bug 1: PowerShell captures multi-line
          # stdout as Object[]. Without an explicit -join, downstream
          # code computed token count from LINE count, the not-smaller
          # guard never fired, and string concat collapsed `n separators
          # to spaces (destroying the `### source` block structure).
          # The fix joins the array right after coagula returns.
          Move-Item integrations/copilot-cli/coagula-post-tool-hook.sh integrations/copilot-cli/coagula-post-tool-hook.sh.bak
          try {
            # Multi-line SSE-shaped input — exactly the field-test failure case.
            $body = (1..400 | ForEach-Object {
              '{"event":"data","seq":' + $_ + ',"payload":"' + ('x' * 25) + '"}'
            }) -join "`n"
            $payload = @{
              sessionId="x"; timestamp=1; cwd="/tmp"
              toolName="powershell"
              toolArgs=@{ command="Get-Content somefile" }
              toolResult=@{ resultType="success"; textResultForLlm=$body }
            } | ConvertTo-Json -Depth 6 -Compress
            $out = $payload | pwsh -NoProfile -File integrations/copilot-cli/coagula-post-tool-hook.ps1
          } finally {
            Move-Item integrations/copilot-cli/coagula-post-tool-hook.sh.bak integrations/copilot-cli/coagula-post-tool-hook.sh
          }
          $obj = $out | ConvertFrom-Json
          $cleaned = $obj.modifiedResult.textResultForLlm
          if (-not $cleaned) { Write-Host "FAIL: post-tool didn't fire"; exit 1 }
          # Newlines must survive. Pre-fix this was 0.
          $newlineCount = ([regex]::Matches($cleaned, "`n")).Count
          if ($newlineCount -lt 10) {
            Write-Host "FAIL: newlines stripped (array-vs-string bug); count=$newlineCount"
            exit 1
          }
          # The header should report a plausible char/4 token count.
          # Pre-fix this was line_count/4 (single digits).
          if ($cleaned -match '\[coagula:\s*(\d+)\s*(?:->|→)\s*(\d+)\s*tok') {
            $reported = [int]$matches[2]
            if ($reported -lt 50) {
              Write-Host "FAIL: header reports $reported tok (line-count-as-char-count bug); cleaned chars=$($cleaned.Length)"
              exit 1
            }
            Write-Host "PASS: header reports $reported tok, $newlineCount newlines preserved"
          } else {
            Write-Host "FAIL: couldn't find [coagula: X -> Y tok] header in cleaned output"
            Write-Host "First 200 chars: $($cleaned.Substring(0, [Math]::Min(200, $cleaned.Length)))"
            exit 1
          }
      - name: preToolUse — shell-family toolName variants ALL rewrite
        shell: pwsh
        run: |
          # v0.3.9 regression for Finding 1: Copilot CLI exposes a
          # family of *_powershell tools (write_powershell, etc.) plus
          # potential MCP-registered shell wrappers (mcp__svr__shell,
          # mcp.acme.bash). The toolName regex now accepts any name
          # ending in a known shell flavor with a recognized separator.
          Move-Item integrations/copilot-cli/coagula-pre-bash-hook.sh integrations/copilot-cli/coagula-pre-bash-hook.sh.bak
          $shellVariants = @('bash','shell','powershell','write_powershell','mcp__svr__shell','mcp.acme.bash')
          try {
            foreach ($name in $shellVariants) {
              $payload = '{"toolName":"' + $name + '","toolArgs":"{\"command\":\"curl https://example.com\"}"}'
              $out = $payload | pwsh -NoProfile -File integrations/copilot-cli/coagula-pre-bash-hook.ps1
              $obj = $out | ConvertFrom-Json
              if (-not $obj.modifiedArgs.command) {
                Write-Host "FAIL: shell-family toolName '$name' was not rewritten"
                Write-Host "Got: $($obj | ConvertTo-Json -Compress)"
                exit 1
              }
              Write-Host "PASS: $name rewrote"
            }
          } finally {
            Move-Item integrations/copilot-cli/coagula-pre-bash-hook.sh.bak integrations/copilot-cli/coagula-pre-bash-hook.sh
          }
      - name: preToolUse — non-shell toolNames ALL pass through
        shell: pwsh
        run: |
          # Companion: anything not matching the shell-family pattern
          # must passthrough cleanly, even when the toolArgs include a
          # bogus `command` field that would otherwise satisfy the
          # noisy-pattern check.
          Move-Item integrations/copilot-cli/coagula-pre-bash-hook.sh integrations/copilot-cli/coagula-pre-bash-hook.sh.bak
          $nonShellTools = @('view','web_fetch','grep','glob','session_store_sql','report_intent')
          try {
            foreach ($name in $nonShellTools) {
              $payload = '{"toolName":"' + $name + '","toolArgs":"{\"command\":\"curl https://example.com\"}"}'
              $out = $payload | pwsh -NoProfile -File integrations/copilot-cli/coagula-pre-bash-hook.ps1
              $obj = $out | ConvertFrom-Json
              if ($obj.modifiedArgs) {
                Write-Host "FAIL: non-shell toolName '$name' was wrongly rewritten"
                Write-Host "Got: $($obj | ConvertTo-Json -Compress)"
                exit 1
              }
              if ($obj.permissionDecision -ne 'allow') {
                Write-Host "FAIL: non-shell toolName '$name' did not get plain allow"
                exit 1
              }
              Write-Host "PASS: $name passed through"
            }
          } finally {
            Move-Item integrations/copilot-cli/coagula-pre-bash-hook.sh.bak integrations/copilot-cli/coagula-pre-bash-hook.sh
          }
      - name: preToolUse — web_fetch gets hint by default (Idea A)
        shell: pwsh
        run: |
          # v0.3.10 Idea A: nudge the model toward funnelable HTTP routes
          # for web_fetch (Copilot CLI doesn't dispatch postToolUse for it
          # — github/copilot-cli#3665). Default on; disable with
          # COAGULA_WEB_FETCH_HINT=off.
          $payload = '{"toolName":"web_fetch","toolArgs":"{\"url\":\"https://example.com\"}"}'
          Move-Item integrations/copilot-cli/coagula-pre-bash-hook.sh integrations/copilot-cli/coagula-pre-bash-hook.sh.bak
          try {
            Remove-Item Env:COAGULA_WEB_FETCH_HINT -ErrorAction SilentlyContinue
            $out = $payload | pwsh -NoProfile -File integrations/copilot-cli/coagula-pre-bash-hook.ps1
          } finally {
            Move-Item integrations/copilot-cli/coagula-pre-bash-hook.sh.bak integrations/copilot-cli/coagula-pre-bash-hook.sh
          }
          $obj = $out | ConvertFrom-Json
          if (-not $obj.additionalContext) {
            Write-Host "FAIL: default-on hint did not fire on web_fetch"
            Write-Host "Got: $($obj | ConvertTo-Json -Compress)"
            exit 1
          }
          if ($obj.additionalContext -notmatch 'Invoke-RestMethod') {
            Write-Host "FAIL: hint missing Invoke-RestMethod nudge: $($obj.additionalContext)"
            exit 1
          }
          if ($obj.modifiedArgs) {
            Write-Host "FAIL: hint should not modify args (just append context)"
            exit 1
          }
          Write-Host "PASS: web_fetch gets default-on hint with Invoke-RestMethod nudge"
      - name: preToolUse — COAGULA_WEB_FETCH_HINT=off disables the hint
        shell: pwsh
        run: |
          $payload = '{"toolName":"web_fetch","toolArgs":"{\"url\":\"https://example.com\"}"}'
          Move-Item integrations/copilot-cli/coagula-pre-bash-hook.sh integrations/copilot-cli/coagula-pre-bash-hook.sh.bak
          try {
            $env:COAGULA_WEB_FETCH_HINT = 'off'
            $out = $payload | pwsh -NoProfile -File integrations/copilot-cli/coagula-pre-bash-hook.ps1
          } finally {
            Move-Item integrations/copilot-cli/coagula-pre-bash-hook.sh.bak integrations/copilot-cli/coagula-pre-bash-hook.sh
            Remove-Item Env:COAGULA_WEB_FETCH_HINT -ErrorAction SilentlyContinue
          }
          $obj = $out | ConvertFrom-Json
          if ($obj.additionalContext) {
            Write-Host "FAIL: =off didn't suppress hint: $($obj | ConvertTo-Json -Compress)"
            exit 1
          }
          if ($obj.permissionDecision -ne 'allow') {
            Write-Host "FAIL: expected plain allow with =off"
            exit 1
          }
          Write-Host "PASS: COAGULA_WEB_FETCH_HINT=off suppresses hint"
      - name: preToolUse — spill-file reads pass through unchanged
        shell: pwsh
        run: |
          # v0.3.8 fix for Issue 4: copilot-tool-output-*.txt is the
          # escape hatch — Copilot persists pre-funnel output there for
          # the model to read. Re-funneling those reads defeats the design.
          $payload = '{"toolName":"powershell","toolArgs":"{\"command\":\"Get-Content C:\\\\Users\\\\j\\\\AppData\\\\Local\\\\Temp\\\\copilot-tool-output-1780533950567-k73z88.txt\"}"}'
          Move-Item integrations/copilot-cli/coagula-pre-bash-hook.sh integrations/copilot-cli/coagula-pre-bash-hook.sh.bak
          try {
            $out = $payload | pwsh -NoProfile -File integrations/copilot-cli/coagula-pre-bash-hook.ps1
          } finally {
            Move-Item integrations/copilot-cli/coagula-pre-bash-hook.sh.bak integrations/copilot-cli/coagula-pre-bash-hook.sh
          }
          $obj = $out | ConvertFrom-Json
          if ($obj.modifiedArgs) {
            Write-Host "FAIL: spill-file read was rewritten (defeats escape hatch)"
            Write-Host "Got: $($obj | ConvertTo-Json -Compress)"
            exit 1
          }
          if ($obj.permissionDecision -ne 'allow') {
            Write-Host "FAIL: expected plain allow, got: $($obj | ConvertTo-Json -Compress)"
            exit 1
          }
          Write-Host "PASS: spill-file read passes through unchanged"
      - name: preToolUse — bash toolName still uses subshell form (regression)
        shell: pwsh
        run: |
          # toolName=bash must keep the `( … )` form so Linux/macOS sessions
          # don't break.
          $payload = '{"toolName":"bash","toolArgs":"{\"command\":\"curl https://example.com\"}"}'
          Move-Item integrations/copilot-cli/coagula-pre-bash-hook.sh integrations/copilot-cli/coagula-pre-bash-hook.sh.bak
          try {
            $out = $payload | pwsh -NoProfile -File integrations/copilot-cli/coagula-pre-bash-hook.ps1
          } finally {
            Move-Item integrations/copilot-cli/coagula-pre-bash-hook.sh.bak integrations/copilot-cli/coagula-pre-bash-hook.sh
          }
          $cmd = ($out | ConvertFrom-Json).modifiedArgs.command
          if ($cmd -notmatch '^\( ') {
            Write-Host "FAIL: bash toolName lost the ( … ) subshell form: $cmd"; exit 1
          }
          Write-Host "PASS: bash toolName uses bash subshell form"
      - name: postToolUse — toolName='powershell' + kubectl should pick profile=k8s
        shell: pwsh
        run: |
          # Sibling v0.3.6 fix: postToolUse profile auto-detection also gated
          # on toolName=='bash'. On Windows kubectl calls were funneling with
          # profile=passthrough instead of profile=k8s, losing the prune wins.
          Move-Item integrations/copilot-cli/coagula-post-tool-hook.sh integrations/copilot-cli/coagula-post-tool-hook.sh.bak
          try {
            $big = (Get-Content -Raw tests/fixtures/kubectl_pod.json) * 20
            $payload = @{
              sessionId="x"; timestamp=1; cwd="/tmp"
              toolName="powershell"
              toolArgs=@{ command="kubectl get pod my-pod -o json" }
              toolResult=@{ resultType="success"; textResultForLlm=$big }
            } | ConvertTo-Json -Depth 6 -Compress
            $out = $payload | pwsh -NoProfile -File integrations/copilot-cli/coagula-post-tool-hook.ps1
          } finally {
            Move-Item integrations/copilot-cli/coagula-post-tool-hook.sh.bak integrations/copilot-cli/coagula-post-tool-hook.sh
          }
          $obj = $out | ConvertFrom-Json
          $cleaned = $obj.modifiedResult.textResultForLlm
          if (-not $cleaned) { Write-Host "FAIL: no modifiedResult"; exit 1 }
          if ($cleaned -notmatch 'profile=k8s') {
            Write-Host "FAIL: profile=k8s not selected. First 200 chars: $($cleaned.Substring(0, [Math]::Min(200,$cleaned.Length)))"
            exit 1
          }
          Write-Host "PASS: toolName=powershell selected profile=k8s"

      - name: preToolUse — case-insensitive (INVOKE-RESTMETHOD) should be rewritten
        shell: pwsh
        run: |
          $env:COAGULA_QUERY = "test"
          $payload = '{"sessionId":"x","timestamp":1,"cwd":"/tmp","toolName":"bash","toolArgs":"{\"command\":\"INVOKE-RESTMETHOD https://api.example.com/v2\"}"}'
          Move-Item integrations/copilot-cli/coagula-pre-bash-hook.sh integrations/copilot-cli/coagula-pre-bash-hook.sh.bak
          try {
            $out = $payload | pwsh -NoProfile -File integrations/copilot-cli/coagula-pre-bash-hook.ps1
          } finally {
            Move-Item integrations/copilot-cli/coagula-pre-bash-hook.sh.bak integrations/copilot-cli/coagula-pre-bash-hook.sh
          }
          $obj = $out | ConvertFrom-Json
          if (-not $obj.modifiedArgs.command -or $obj.modifiedArgs.command -notmatch 'coagula --query') {
            Write-Host "FAIL: INVOKE-RESTMETHOD not rewritten (case-insensitive broken): $($obj | ConvertTo-Json -Compress)"; exit 1
          }
          Write-Host "PASS: case-insensitive match works"
      - name: preToolUse — echo should pass through
        shell: pwsh
        run: |
          $payload = '{"sessionId":"x","timestamp":1,"cwd":"/tmp","toolName":"bash","toolArgs":"{\"command\":\"echo hi\"}"}'
          Move-Item integrations/copilot-cli/coagula-pre-bash-hook.sh integrations/copilot-cli/coagula-pre-bash-hook.sh.bak
          try {
            $out = $payload | pwsh -NoProfile -File integrations/copilot-cli/coagula-pre-bash-hook.ps1
          } finally {
            Move-Item integrations/copilot-cli/coagula-pre-bash-hook.sh.bak integrations/copilot-cli/coagula-pre-bash-hook.sh
          }
          $obj = $out | ConvertFrom-Json
          if ($obj.modifiedArgs) { Write-Host "FAIL: harmless echo was rewritten"; exit 1 }
          if ($obj.permissionDecision -ne 'allow') { Write-Host "FAIL: expected allow"; exit 1 }
          Write-Host "PASS: preToolUse echo passthrough"
      - name: postToolUse — big crashloop output should be funneled
        shell: pwsh
        run: |
          Move-Item integrations/copilot-cli/coagula-post-tool-hook.sh integrations/copilot-cli/coagula-post-tool-hook.sh.bak
          try {
            $env:COAGULA_QUERY = "why connection refused"
            $big = Get-Content -Raw tests/fixtures/crashloop.log
            $payload = @{
              sessionId = "x"; timestamp = 1; cwd = "/tmp"
              toolName = "bash"
              toolArgs = @{ command = "journalctl -u svc" }
              toolResult = @{ resultType = "success"; textResultForLlm = $big }
            } | ConvertTo-Json -Depth 6 -Compress
            $out = $payload | pwsh -NoProfile -File integrations/copilot-cli/coagula-post-tool-hook.ps1
          } finally {
            Move-Item integrations/copilot-cli/coagula-post-tool-hook.sh.bak integrations/copilot-cli/coagula-post-tool-hook.sh
          }
          $obj = $out | ConvertFrom-Json
          $cleaned = $obj.modifiedResult.textResultForLlm
          if (-not $cleaned) { Write-Host "FAIL: no modifiedResult.textResultForLlm"; exit 1 }
          $reduction = 1 - ($cleaned.Length / $big.Length)
          if ($reduction -lt 0.9) {
            Write-Host "FAIL: reduction was $reduction"; exit 1
          }
          Write-Host "PASS: postToolUse reduced $($big.Length) -> $($cleaned.Length) chars ($($reduction * 100)%)"

  # Regression coverage for the two Windows bugs caught in field testing:
  # (1) WSL bash false-defer — hooks deferred to WSL launcher which can't
  #     read C:\... paths, silently failing on Windows boxes without Git Bash.
  # (2) Installer PATH false-warning — install.ps1 warned "coagula not on PATH"
  #     before refreshing PATH from the registry post-pip-install.
  windows-bugfix-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test-SafeBash accepts Git Bash (uname -> MINGW)
        shell: pwsh
        run: |
          function Test-SafeBash {
            param([string]$BashPath)
            if (-not $BashPath) { return $false }
            if ($BashPath -match '\\System32\\(bash|wsl)\.exe$') { return $false }
            $onWindows = [System.Environment]::OSVersion.Platform -eq 'Win32NT'
            if (-not $onWindows) { return $true }
            try {
              $u = & $BashPath -c 'uname -s' 2>$null
              return ($u -match '^(MINGW|CYGWIN|MSYS)')
            } catch { return $false }
          }
          # Windows runners ship with Git Bash at C:\Program Files\Git\bin\bash.exe.
          $bash = Get-Command bash -ErrorAction SilentlyContinue
          if (-not $bash) { Write-Host "FAIL: no bash on runner — unexpected"; exit 1 }
          Write-Host "Resolved bash: $($bash.Source)"
          $u = & $bash.Source -c 'uname -s'
          Write-Host "uname -s reports: $u"
          if (-not (Test-SafeBash $bash.Source)) {
            Write-Host "FAIL: Git Bash on runner classified as unsafe"; exit 1
          }
          Write-Host "PASS: Git Bash correctly classified safe"

      - name: Test-SafeBash rejects fake WSL bash (uname -> Linux)
        shell: pwsh
        run: |
          function Test-SafeBash {
            param([string]$BashPath)
            if (-not $BashPath) { return $false }
            if ($BashPath -match '\\System32\\(bash|wsl)\.exe$') { return $false }
            $onWindows = [System.Environment]::OSVersion.Platform -eq 'Win32NT'
            if (-not $onWindows) { return $true }
            try {
              $u = & $BashPath -c 'uname -s' 2>$null
              return ($u -match '^(MINGW|CYGWIN|MSYS)')
            } catch { return $false }
          }
          # Fabricate a bash shim that returns Linux for `uname -s`.
          # cmd shim ignores its args and echoes "Linux" — that's enough since
          # Test-SafeBash only invokes `bash -c 'uname -s'` and reads stdout.
          $fakeDir = Join-Path $env:RUNNER_TEMP "fake-wsl-$(Get-Random)"
          New-Item -ItemType Directory -Force -Path $fakeDir | Out-Null
          $fake = Join-Path $fakeDir "fake-bash.cmd"
          Set-Content -LiteralPath $fake -Value "@echo off`r`necho Linux"
          if (Test-SafeBash $fake) {
            Write-Host "FAIL: fake-WSL bash classified safe — would have deferred wrongly"
            exit 1
          }
          Write-Host "PASS: fake-WSL bash correctly classified unsafe"

      - name: Test-SafeBash rejects the WSL launcher path even before invocation
        shell: pwsh
        run: |
          function Test-SafeBash {
            param([string]$BashPath)
            if (-not $BashPath) { return $false }
            if ($BashPath -match '\\System32\\(bash|wsl)\.exe$') { return $false }
            if ($BashPath -match '\\WindowsApps\\') { return $false }
            return $true  # short-circuit the rest for this isolated test
          }
          $launchers = @(
            'C:\Windows\System32\bash.exe'
            # Win11 default Store stub — the actual failure mode from the v0.3.0 field report.
            "C:\Users\j\AppData\Local\Microsoft\WindowsApps\bash.exe"
          )
          foreach ($l in $launchers) {
            if (Test-SafeBash $l) {
              Write-Host "FAIL: WSL launcher path '$l' was NOT rejected"
              exit 1
            }
            Write-Host "PASS: rejected $l"
          }

      - name: postToolUse hook writes a debug log entry on transform
        shell: pwsh
        run: |
          # Field-request: users couldn't tell whether hooks were firing.
          # The hook now appends a transform-only line to ~/.copilot/coagula-debug.log.
          # Override path via COAGULA_DEBUG_LOG to keep this test isolated.
          pip install -e .
          $logFile = Join-Path $env:RUNNER_TEMP "coagula-debug-$(Get-Random).log"
          $env:COAGULA_DEBUG_LOG = $logFile
          Move-Item integrations/copilot-cli/coagula-post-tool-hook.sh integrations/copilot-cli/coagula-post-tool-hook.sh.bak
          try {
            $big = Get-Content -Raw tests/fixtures/crashloop.log
            $payload = @{
              sessionId="x"; timestamp=1; cwd="/tmp"
              toolName="bash"
              toolArgs=@{ command="journalctl -u svc" }
              toolResult=@{ resultType="success"; textResultForLlm=$big }
            } | ConvertTo-Json -Depth 6 -Compress
            $null = $payload | pwsh -NoProfile -File integrations/copilot-cli/coagula-post-tool-hook.ps1
          } finally {
            Move-Item integrations/copilot-cli/coagula-post-tool-hook.sh.bak integrations/copilot-cli/coagula-post-tool-hook.sh
          }
          if (-not (Test-Path $logFile)) {
            Write-Host "FAIL: debug log file not created at $logFile"
            exit 1
          }
          $content = Get-Content -Raw -LiteralPath $logFile
          if ($content -notmatch '\[post-tool\] funneled') {
            Write-Host "FAIL: log file missing [post-tool] entry. Content: $content"
            exit 1
          }
          Write-Host "PASS: debug log entry written: $($content.Trim())"

      - name: install.ps1 PATH refresh surfaces freshly-installed coagula
        shell: pwsh
        run: |
          # Reproduce the field bug: install coagula, then deliberately
          # poison the current process PATH so coagula.exe isn't visible.
          # install.ps1's Update-PathFromRegistry must restore it from the
          # registry before the sanity-check warnings fire.
          pip install -e .
          # Capture where coagula landed so we can compare PATH later.
          $coagulaExe = (Get-Command coagula -ErrorAction Stop).Source
          Write-Host "coagula installed at: $coagulaExe"
          $coagulaDir = Split-Path -Parent $coagulaExe
          # Strip coagula's dir from $env:Path to simulate "fresh shell"
          # state where the install ran moments before this script.
          $env:Path = ($env:Path -split ';' | Where-Object { $_ -ne $coagulaDir }) -join ';'
          if (Get-Command coagula -ErrorAction SilentlyContinue) {
            Write-Host "SETUP-FAIL: coagula still visible after PATH poisoning"
            exit 1
          }
          Write-Host "PATH poisoned; coagula now invisible to Get-Command."
          # Dry-run install.ps1 in a sandboxed USERPROFILE and capture warnings.
          $sandbox = Join-Path $env:RUNNER_TEMP "coagula-pathfix-$(Get-Random)"
          New-Item -ItemType Directory -Force -Path $sandbox | Out-Null
          $env:USERPROFILE = $sandbox
          $output = & .\integrations\copilot-cli\install.ps1 2>&1 | Out-String
          Write-Host "--- installer output ---"
          Write-Host $output
          Write-Host "------------------------"
          if ($output -match "'coagula' not on PATH") {
            Write-Host "FAIL: installer false-warned despite PATH refresh"
            exit 1
          }
          Write-Host "PASS: installer did not false-warn after PATH refresh"

  # End-to-end: real wheel install, real CLI invocation, real fixture data.
  cli-e2e-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install coagula
        run: pip install -e .
      - name: Coagula CLI funnels the crashloop log
        shell: pwsh
        run: |
          # PowerShell auto-splits native-command stdout into an array of
          # lines, so we re-join to measure char count (not line count) and
          # search content with -match (not array -notmatch which returns
          # matching elements, not a boolean).
          $inText = Get-Content -Raw tests/fixtures/crashloop.log
          $inChars = $inText.Length
          $outArr = $inText | coagula --query "why connection refused" --profile passthrough --budget 2000 --keep 5
          $outText = ($outArr | Out-String).Trim()
          $outChars = $outText.Length
          $reduction = 1 - ($outChars / $inChars)
          Write-Host "Input: $inChars chars, Output: $outChars chars, Reduction: $($reduction.ToString('P1'))"
          if ($reduction -lt 0.99) { Write-Host "FAIL: expected >=99% reduction"; exit 1 }
          if (-not ($outText -match 'connection refused')) {
            Write-Host "FAIL: signal lost"
            Write-Host "---OUTPUT START---"
            Write-Host $outText
            Write-Host "---OUTPUT END---"
            exit 1
          }
          Write-Host "PASS: CLI funnel works end-to-end on Windows"
