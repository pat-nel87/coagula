name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -v
      - name: Smoke-test demo (Linux/macOS)
        if: runner.os != 'Windows'
        run: python demo.py | tail -5
      - name: Smoke-test demo (Windows)
        if: runner.os == 'Windows'
        run: python demo.py | Select-Object -Last 5
        shell: pwsh

  # Syntax-validate the PowerShell hooks + installers. Cheap and
  # native-Windows so we catch PS parsing regressions in PRs.
  powershell-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse all .ps1 files
        shell: pwsh
        run: |
          $ps1 = Get-ChildItem -Recurse -Filter *.ps1 integrations
          $fail = 0
          foreach ($f in $ps1) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              Write-Host "FAIL: $($f.FullName)"
              $errors | ForEach-Object { Write-Host "  $($_.Message) (line $($_.Extent.StartLineNumber))" }
              $fail = 1
            } else {
              Write-Host "OK:   $($f.FullName)"
            }
          }
          if ($fail) { exit 1 }

  # Lint the bash hooks. shellcheck catches the standard footguns; cheap
  # on a Linux runner.
  shell-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck integrations/**/*.sh
