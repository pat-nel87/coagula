[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coagula"
version = "0.5.1"
description = "Local context-funnel for GitHub Copilot CLI: trim, dedup, prune, rank, and compress noisy tool output before it reaches the model."
requires-python = ">=3.10"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "pat-nel87" }]
dependencies = []

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.7"]
ollama = []   # documentation only — coagula.models.ollama uses stdlib urllib
dev = ["pytest>=8"]

[project.scripts]
coagula = "coagula.cli:main"

[tool.setuptools.packages.find]
include = ["coagula*"]
exclude = ["tests*"]
