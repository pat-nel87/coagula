name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -v
      - name: Smoke-test demo (Linux/macOS)
        if: runner.os != 'Windows'
        run: python demo.py | tail -5
      - name: Smoke-test demo (Windows)
        if: runner.os == 'Windows'
        run: python demo.py | Select-Object -Last 5
        shell: pwsh

  # Syntax-validate the PowerShell hooks + installers. Cheap and
  # native-Windows so we catch PS parsing regressions in PRs.
  powershell-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse all .ps1 files
        shell: pwsh
        run: |
          $ps1 = Get-ChildItem -Recurse -Filter *.ps1 integrations
          $fail = 0
          foreach ($f in $ps1) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              Write-Host "FAIL: $($f.FullName)"
              $errors | ForEach-Object { Write-Host "  $($_.Message) (line $($_.Extent.StartLineNumber))" }
              $fail = 1
            } else {
              Write-Host "OK:   $($f.FullName)"
            }
          }
          if ($fail) { exit 1 }

  # Lint the bash hooks. shellcheck catches the standard footguns; cheap
  # on a Linux runner.
  shell-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck integrations/**/*.sh

  # Verify the Windows installer scripts actually run and produce valid
  # config JSON. Sandboxes USERPROFILE to a temp dir so the runner's home
  # is untouched.
  installer-dryrun-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install coagula (needed so install scripts find `coagula`)
        run: pip install -e .
      - name: Sandbox USERPROFILE and run Copilot CLI installer
        shell: pwsh
        run: |
          $sandbox = Join-Path $env:RUNNER_TEMP "coagula-sandbox"
          New-Item -ItemType Directory -Force -Path $sandbox | Out-Null
          $env:USERPROFILE = $sandbox
          .\integrations\copilot-cli\install.ps1
          $cfg = Join-Path $sandbox '.copilot\hooks\coagula.json'
          if (-not (Test-Path $cfg)) { Write-Host "FAIL: $cfg not created"; exit 1 }
          $parsed = Get-Content -Raw -LiteralPath $cfg | ConvertFrom-Json
          if (-not $parsed.hooks.preToolUse[0].bash)       { Write-Host "FAIL: preToolUse.bash missing"; exit 1 }
          if (-not $parsed.hooks.preToolUse[0].powershell) { Write-Host "FAIL: preToolUse.powershell missing"; exit 1 }
          if (-not $parsed.hooks.postToolUse[0].bash)       { Write-Host "FAIL: postToolUse.bash missing"; exit 1 }
          if (-not $parsed.hooks.postToolUse[0].powershell) { Write-Host "FAIL: postToolUse.powershell missing"; exit 1 }
          Write-Host "PASS: dual-field config created at $cfg"
      - name: Sandbox USERPROFILE and run Claude Code installer
        shell: pwsh
        run: |
          $sandbox = Join-Path $env:RUNNER_TEMP "coagula-cc-sandbox"
          New-Item -ItemType Directory -Force -Path $sandbox | Out-Null
          $env:USERPROFILE = $sandbox
          .\integrations\claude-code\install.ps1 -AutoUpdateSettings
          $settings = Join-Path $sandbox '.claude\settings.json'
          if (-not (Test-Path $settings)) { Write-Host "FAIL: $settings not created"; exit 1 }
          $parsed = Get-Content -Raw -LiteralPath $settings | ConvertFrom-Json
          $bashEntry = $parsed.hooks.PreToolUse | Where-Object { $_.matcher -eq 'Bash' }
          if (-not $bashEntry) { Write-Host "FAIL: no Bash matcher in settings.json"; exit 1 }
          if (-not $bashEntry.hooks[0].command) { Write-Host "FAIL: hook command missing"; exit 1 }
          Write-Host "PASS: settings.json patched at $settings"

  # Feed synthetic Copilot CLI payloads to each PowerShell hook on a
  # Windows runner. Catches PS-specific bugs (string-quoting, encoding,
  # JSON serialization) that the parse check misses.
  ps-hook-stdin-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install coagula
        run: pip install -e .
      - name: preToolUse — kubectl should be rewritten
        shell: pwsh
        run: |
          $payload = '{"sessionId":"x","timestamp":1,"cwd":"/tmp","toolName":"bash","toolArgs":"{\"command\":\"kubectl get pod -o json\",\"description\":\"x\",\"initial_wait\":30}"}'
          $env:COAGULA_QUERY = "why is pod crashing"
          # Force native PS path by hiding the .sh sibling temporarily.
          Move-Item integrations/copilot-cli/coagula-pre-bash-hook.sh integrations/copilot-cli/coagula-pre-bash-hook.sh.bak
          try {
            $out = $payload | pwsh -NoProfile -File integrations/copilot-cli/coagula-pre-bash-hook.ps1
          } finally {
            Move-Item integrations/copilot-cli/coagula-pre-bash-hook.sh.bak integrations/copilot-cli/coagula-pre-bash-hook.sh
          }
          $obj = $out | ConvertFrom-Json
          if (-not $obj.modifiedArgs.command) { Write-Host "FAIL: no modifiedArgs.command"; exit 1 }
          if ($obj.modifiedArgs.command -notmatch 'coagula --query.*--profile k8s') {
            Write-Host "FAIL: rewrite missing k8s profile: $($obj.modifiedArgs.command)"; exit 1
          }
          Write-Host "PASS: preToolUse kubectl rewrite ($($obj.modifiedArgs.command))"
      - name: preToolUse — echo should pass through
        shell: pwsh
        run: |
          $payload = '{"sessionId":"x","timestamp":1,"cwd":"/tmp","toolName":"bash","toolArgs":"{\"command\":\"echo hi\"}"}'
          Move-Item integrations/copilot-cli/coagula-pre-bash-hook.sh integrations/copilot-cli/coagula-pre-bash-hook.sh.bak
          try {
            $out = $payload | pwsh -NoProfile -File integrations/copilot-cli/coagula-pre-bash-hook.ps1
          } finally {
            Move-Item integrations/copilot-cli/coagula-pre-bash-hook.sh.bak integrations/copilot-cli/coagula-pre-bash-hook.sh
          }
          $obj = $out | ConvertFrom-Json
          if ($obj.modifiedArgs) { Write-Host "FAIL: harmless echo was rewritten"; exit 1 }
          if ($obj.permissionDecision -ne 'allow') { Write-Host "FAIL: expected allow"; exit 1 }
          Write-Host "PASS: preToolUse echo passthrough"
      - name: postToolUse — big crashloop output should be funneled
        shell: pwsh
        run: |
          Move-Item integrations/copilot-cli/coagula-post-tool-hook.sh integrations/copilot-cli/coagula-post-tool-hook.sh.bak
          try {
            $env:COAGULA_QUERY = "why connection refused"
            $big = Get-Content -Raw tests/fixtures/crashloop.log
            $payload = @{
              sessionId = "x"; timestamp = 1; cwd = "/tmp"
              toolName = "bash"
              toolArgs = @{ command = "journalctl -u svc" }
              toolResult = @{ resultType = "success"; textResultForLlm = $big }
            } | ConvertTo-Json -Depth 6 -Compress
            $out = $payload | pwsh -NoProfile -File integrations/copilot-cli/coagula-post-tool-hook.ps1
          } finally {
            Move-Item integrations/copilot-cli/coagula-post-tool-hook.sh.bak integrations/copilot-cli/coagula-post-tool-hook.sh
          }
          $obj = $out | ConvertFrom-Json
          $cleaned = $obj.modifiedResult.textResultForLlm
          if (-not $cleaned) { Write-Host "FAIL: no modifiedResult.textResultForLlm"; exit 1 }
          $reduction = 1 - ($cleaned.Length / $big.Length)
          if ($reduction -lt 0.9) {
            Write-Host "FAIL: reduction was $reduction"; exit 1
          }
          Write-Host "PASS: postToolUse reduced $($big.Length) -> $($cleaned.Length) chars ($($reduction * 100)%)"

  # Regression coverage for the two Windows bugs caught in field testing:
  # (1) WSL bash false-defer — hooks deferred to WSL launcher which can't
  #     read C:\... paths, silently failing on Windows boxes without Git Bash.
  # (2) Installer PATH false-warning — install.ps1 warned "coagula not on PATH"
  #     before refreshing PATH from the registry post-pip-install.
  windows-bugfix-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test-SafeBash accepts Git Bash (uname -> MINGW)
        shell: pwsh
        run: |
          function Test-SafeBash {
            param([string]$BashPath)
            if (-not $BashPath) { return $false }
            if ($BashPath -match '\\System32\\(bash|wsl)\.exe$') { return $false }
            $onWindows = [System.Environment]::OSVersion.Platform -eq 'Win32NT'
            if (-not $onWindows) { return $true }
            try {
              $u = & $BashPath -c 'uname -s' 2>$null
              return ($u -match '^(MINGW|CYGWIN|MSYS)')
            } catch { return $false }
          }
          # Windows runners ship with Git Bash at C:\Program Files\Git\bin\bash.exe.
          $bash = Get-Command bash -ErrorAction SilentlyContinue
          if (-not $bash) { Write-Host "FAIL: no bash on runner — unexpected"; exit 1 }
          Write-Host "Resolved bash: $($bash.Source)"
          $u = & $bash.Source -c 'uname -s'
          Write-Host "uname -s reports: $u"
          if (-not (Test-SafeBash $bash.Source)) {
            Write-Host "FAIL: Git Bash on runner classified as unsafe"; exit 1
          }
          Write-Host "PASS: Git Bash correctly classified safe"

      - name: Test-SafeBash rejects fake WSL bash (uname -> Linux)
        shell: pwsh
        run: |
          function Test-SafeBash {
            param([string]$BashPath)
            if (-not $BashPath) { return $false }
            if ($BashPath -match '\\System32\\(bash|wsl)\.exe$') { return $false }
            $onWindows = [System.Environment]::OSVersion.Platform -eq 'Win32NT'
            if (-not $onWindows) { return $true }
            try {
              $u = & $BashPath -c 'uname -s' 2>$null
              return ($u -match '^(MINGW|CYGWIN|MSYS)')
            } catch { return $false }
          }
          # Fabricate a bash shim that returns Linux for `uname -s`.
          $fakeDir = Join-Path $env:RUNNER_TEMP "fake-wsl-$(Get-Random)"
          New-Item -ItemType Directory -Force -Path $fakeDir | Out-Null
          $fake = Join-Path $fakeDir "fake-bash.cmd"
          # cmd shim: echo "Linux" then exit. Argv parsing is good enough since
          # Test-SafeBash only invokes `bash -c 'uname -s'`.
          @'
@echo off
echo Linux
'@ | Set-Content -LiteralPath $fake
          if (Test-SafeBash $fake) {
            Write-Host "FAIL: fake-WSL bash classified safe — would have deferred wrongly"
            exit 1
          }
          Write-Host "PASS: fake-WSL bash correctly classified unsafe"

      - name: Test-SafeBash rejects the WSL launcher path even before invocation
        shell: pwsh
        run: |
          function Test-SafeBash {
            param([string]$BashPath)
            if (-not $BashPath) { return $false }
            if ($BashPath -match '\\System32\\(bash|wsl)\.exe$') { return $false }
            return $true  # short-circuit the rest for this isolated test
          }
          $launcher = 'C:\Windows\System32\bash.exe'
          if (Test-SafeBash $launcher) {
            Write-Host "FAIL: WSL launcher path not rejected"
            exit 1
          }
          Write-Host "PASS: WSL launcher path rejected by path pattern"

      - name: install.ps1 PATH refresh surfaces freshly-installed coagula
        shell: pwsh
        run: |
          # Reproduce the field bug: install coagula, then deliberately
          # poison the current process PATH so coagula.exe isn't visible.
          # install.ps1's Update-PathFromRegistry must restore it from the
          # registry before the sanity-check warnings fire.
          pip install -e .
          # Capture where coagula landed so we can compare PATH later.
          $coagulaExe = (Get-Command coagula -ErrorAction Stop).Source
          Write-Host "coagula installed at: $coagulaExe"
          $coagulaDir = Split-Path -Parent $coagulaExe
          # Strip coagula's dir from $env:Path to simulate "fresh shell"
          # state where the install ran moments before this script.
          $env:Path = ($env:Path -split ';' | Where-Object { $_ -ne $coagulaDir }) -join ';'
          if (Get-Command coagula -ErrorAction SilentlyContinue) {
            Write-Host "SETUP-FAIL: coagula still visible after PATH poisoning"
            exit 1
          }
          Write-Host "PATH poisoned; coagula now invisible to Get-Command."
          # Dry-run install.ps1 in a sandboxed USERPROFILE and capture warnings.
          $sandbox = Join-Path $env:RUNNER_TEMP "coagula-pathfix-$(Get-Random)"
          New-Item -ItemType Directory -Force -Path $sandbox | Out-Null
          $env:USERPROFILE = $sandbox
          $output = & .\integrations\copilot-cli\install.ps1 2>&1 | Out-String
          Write-Host "--- installer output ---"
          Write-Host $output
          Write-Host "------------------------"
          if ($output -match "'coagula' not on PATH") {
            Write-Host "FAIL: installer false-warned despite PATH refresh"
            exit 1
          }
          Write-Host "PASS: installer did not false-warn after PATH refresh"

  # End-to-end: real wheel install, real CLI invocation, real fixture data.
  cli-e2e-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install coagula
        run: pip install -e .
      - name: Coagula CLI funnels the crashloop log
        shell: pwsh
        run: |
          # PowerShell auto-splits native-command stdout into an array of
          # lines, so we re-join to measure char count (not line count) and
          # search content with -match (not array -notmatch which returns
          # matching elements, not a boolean).
          $inText = Get-Content -Raw tests/fixtures/crashloop.log
          $inChars = $inText.Length
          $outArr = $inText | coagula --query "why connection refused" --profile passthrough --budget 2000 --keep 5
          $outText = ($outArr | Out-String).Trim()
          $outChars = $outText.Length
          $reduction = 1 - ($outChars / $inChars)
          Write-Host "Input: $inChars chars, Output: $outChars chars, Reduction: $($reduction.ToString('P1'))"
          if ($reduction -lt 0.99) { Write-Host "FAIL: expected >=99% reduction"; exit 1 }
          if (-not ($outText -match 'connection refused')) {
            Write-Host "FAIL: signal lost"
            Write-Host "---OUTPUT START---"
            Write-Host $outText
            Write-Host "---OUTPUT END---"
            exit 1
          }
          Write-Host "PASS: CLI funnel works end-to-end on Windows"
